name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: electro-task-backend-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s %s\n' \
            "$VPS_HOST" \
            "$VPS_HOST_KEY" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Upload backend files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          rsync \
            -az \
            --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='logs/' \
            --exclude='*.log' \
            -e "ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o BatchMode=yes -o ConnectTimeout=30" \
            ./ \
            "$VPS_USER@$VPS_HOST:/var/www/electro-task-backend/"

      - name: Install, restart, and verify backend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            "$VPS_USER@$VPS_HOST" <<'REMOTE'
          set -e

          cd /var/www/electro-task-backend

          echo "Installing production dependencies..."
          npm ci --omit=dev

          echo "Restarting backend..."
          pm2 restart electro-task-backend --update-env
          pm2 save

          echo "Waiting for backend..."

          for attempt in $(seq 1 20); do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8600/health
            then
              echo
              echo "Backend deployment completed successfully."
              pm2 status
              exit 0
            fi

            echo "Health attempt ${attempt}/20 failed."
            sleep 3
          done

          echo "Backend failed to become healthy."
          pm2 status
          pm2 logs electro-task-backend --lines 100 --nostream
          exit 1
          REMOTE

      - name: Verify public API
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            https://electro-api.hostwover.com/health

      - name: Deployment summary
        if: success()
        run: |
          echo "### Backend deployed successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: https://electro-api.hostwover.com" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health: https://electro-api.hostwover.com/health" >> "$GITHUB_STEP_SUMMARY"